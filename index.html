<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👜 Minha Mochila Escolar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      min-height: 100vh;
      color: #1e2937;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 35px 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2.8em;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.1em;
      opacity: 0.95;
    }

    .main {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      padding: 30px;
    }

    /* Coluna Esquerda */
    .left {
      flex: 1;
      min-width: 300px;
    }

    .right {
      flex: 1.6;
      min-width: 380px;
    }

    h2 {
      font-size: 1.6em;
      color: #4338ca;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Matérias Disponíveis */
    .materias-disponiveis {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(145deg, #f8fafc, #f1f5f9);
      border: 2px solid #e0e7ff;
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      color: #1e2937;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: #6366f1;
      box-shadow: 0 15px 25px rgba(99, 102, 241, 0.2);
    }

    .card i {
      font-size: 1.8em;
      margin-bottom: 10px;
      color: #6366f1;
    }

    /* Mochila */
    .mochila {
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px;
      min-height: 520px;
      border: 3px dashed #c4d0ff;
    }

    .item-mochila {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .item-mochila:hover {
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15);
      transform: translateY(-3px);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .item-header h3 {
      font-size: 1.2em;
      color: #4338ca;
    }

    .anotacao {
      font-size: 0.95em;
      color: #475569;
      line-height: 1.4;
      padding-left: 5px;
      border-left: 3px solid #6366f1;
    }

    .btn-remover {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85em;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #64748b;
    }

    .empty-state i {
      font-size: 4em;
      margin-bottom: 15px;
      opacity: 0.3;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 520px;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 15px;
      border: 2px solid #e0e7ff;
      border-radius: 14px;
      font-size: 1em;
      resize: vertical;
      margin-top: 10px;
    }

    .modal-buttons {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1em;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-save {
      background: #6366f1;
      color: white;
    }

    .footer {
      text-align: center;
      padding: 22px;
      background: #f8fafc;
      color: #64748b;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fas fa-backpack"></i> Minha Mochila</h1>
      <p>Organize suas matérias e anotações do semestre</p>
    </header>

    <div class="main">
      <!-- Matérias Disponíveis -->
      <div class="left">
        <h2><i class="fas fa-book"></i> Matérias Disponíveis</h2>
        <div class="materias-disponiveis" id="lista-disponiveis"></div>
      </div>

      <!-- Mochila -->
      <div class="right">
        <h2><i class="fas fa-school"></i> Minha Mochila (<span id="contador">0</span>)</h2>
        <div class="mochila" id="mochila">
          <!-- Preenchido pelo JavaScript -->
        </div>
        <br>
        <button onclick="limparMochila()" style="background:#ef4444; color:white;">
          <i class="fas fa-trash"></i> Limpar Mochila
        </button>
      </div>
    </div>

    <div class="footer">
      Mochila Escolar • Feita com carinho para o GitHub
    </div>
  </div>

  <!-- Modal de Anotações -->
  <div class="modal" id="modalAnotacao">
    <div class="modal-content">
      <h2 id="modalTitulo">Anotações - Matemática</h2>
      <textarea id="textoAnotacao" placeholder="Escreva aqui suas anotações, tarefas, provas, links..."></textarea>
      
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn-save" onclick="salvarAnotacao()">Salvar Anotação</button>
      </div>
    </div>
  </div>

  <script>
    const materiasDisponiveis = [
      "Português", "Matemática", "História", "Filosofia", "Sociologia",
      "Inglês", "Geografia", "Artes", "HTML", "AMC", "Lógica de Programação",
      "Noções de Robótica", "Projeto de Vida", "Estudos Orientados", "Programação Web"
    ];

    let mochila = []; // { nome: "", anotacao: "" }

    function renderizarDisponiveis() {
      const container = document.getElementById('lista-disponiveis');
      container.innerHTML = '';

      materiasDisponiveis.forEach(materia => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <i class="fas fa-book-open"></i>
          <div>${materia}</div>
        `;
        card.onclick = () => adicionarNaMochila(materia);
        container.appendChild(card);
      });
    }

    function adicionarNaMochila(materia) {
      if (mochila.some(item => item.nome === materia)) {
        alert(`⚠️ ${materia} já está na sua mochila!`);
        return;
      }

      mochila.push({ nome: materia, anotacao: "" });
      renderizarMochila();
    }

    function renderizarMochila() {
      const container = document.getElementById('mochila');
      const contador = document.getElementById('contador');
      contador.textContent = mochila.length;

      if (mochila.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-backpack"></i>
            <h3>Sua mochila está vazia</h3>
            <p>Clique nas matérias à esquerda para começar</p>
          </div>
        `;
        return;
      }

      let html = '';
      mochila.forEach((item, index) => {
        html += `
          <div class="item-mochila" onclick="abrirModal(${index})">
            <div class="item-header">
              <h3><i class="fas fa-book"></i> ${item.nome}</h3>
              <button class="btn-remover" onclick="event.stopImmediatePropagation(); removerDaMochila(${index});">
                <i class="fas fa-trash"></i>
              </button>
            </div>
            ${item.anotacao ? 
              `<p class="anotacao">${item.anotacao.substring(0, 120)}${item.anotacao.length > 120 ? '...' : ''}</p>` 
              : '<p style="color:#94a3b8; font-style:italic;">Clique para adicionar anotações...</p>'}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    let indexAtual = null;

    function abrirModal(index) {
      indexAtual = index;
      const item = mochila[index];
      document.getElementById('modalTitulo').textContent = `Anotações - ${item.nome}`;
      document.getElementById('textoAnotacao').value = item.anotacao || "";
      document.getElementById('modalAnotacao').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('modalAnotacao').style.display = 'none';
    }

    function salvarAnotacao() {
      if (indexAtual !== null) {
        const texto = document.getElementById('textoAnotacao').value.trim();
        mochila[indexAtual].anotacao = texto;
        fecharModal();
        renderizarMochila();
      }
    }

    function removerDaMochila(index) {
      if (confirm(`Deseja remover ${mochila[index].nome} da mochila?`)) {
        mochila.splice(index, 1);
        renderizarMochila();
      }
    }

    function limparMochila() {
      if (confirm("⚠️ Tem certeza que deseja limpar TODA a mochila?")) {
        mochila = [];
        renderizarMochila();
      }
    }

    // Inicialização
    window.onload = () => {
      renderizarDisponiveis();
      renderizarMochila();
    };
  </script>
</body>
</html>
