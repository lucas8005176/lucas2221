<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Mochila</title>

  <!-- Fonte bonita -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .search {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #6a5acd, #836fff);
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .item {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .item:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(5px);
    }

    /* CONTEÚDO */
    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
      animation: fadeIn 1s ease;
    }

    .card img {
      width: 120px;
      margin-bottom: 20px;
      animation: float 3s infinite ease-in-out;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.7;
    }

    /* ANIMAÇÕES */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div class="logo">🎒 Minha Mochila</div>

    <input class="search" placeholder="Buscar matéria...">

    <button class="btn">+ Nova Matéria</button>

    <div class="item">📘 Artes</div>
    <div class="item">🏃 Educação Física</div>
    <div class="item">💻 Lógica de Programação</div>
    <div class="item">🌐 HTML & CSS</div>
    <div class="item">🚀 Programação Web</div>

  </div>

  <div class="content">
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/1046/1046876.png">
      <h1>Bem-vindo à sua Mochila!</h1>
      <p>Organize suas aulas e anotações aqui.</p>
    </div>
  </div>

</body>
</html>
