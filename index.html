<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👜 Minha Mochila Escolar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      min-height: 100vh;
      color: #1e2937;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 35px 40px;
      text-align: center;
    }

    header h1 { font-size: 2.8em; margin-bottom: 8px; }
    header p { font-size: 1.1em; opacity: 0.95; }

    .main { display: flex; flex-wrap: wrap; gap: 25px; padding: 30px; }
    .left { flex: 1; min-width: 300px; }
    .right { flex: 1.6; min-width: 380px; }

    h2 {
      font-size: 1.6em;
      color: #4338ca;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .materias-disponiveis {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(145deg, #f8fafc, #f1f5f9);
      border: 2px solid #e0e7ff;
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: #6366f1;
      box-shadow: 0 15px 25px rgba(99, 102, 241, 0.2);
    }

    .mochila {
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px;
      min-height: 520px;
      border: 3px dashed #c4d0ff;
    }

    .item-mochila {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .item-mochila:hover {
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15);
      transform: translateY(-3px);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .anotacao {
      font-size: 0.95em;
      color: #475569;
      line-height: 1.4;
      padding-left: 5px;
      border-left: 3px solid #6366f1;
      margin-top: 8px;
    }

    .meta-anotacao {
      font-size: 0.85em;
      color: #64748b;
      margin-top: 8px;
    }

    .btn-remover {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85em;
    }

    .empty-state { text-align: center; padding: 80px 20px; color: #64748b; }
    .empty-state i { font-size: 4em; margin-bottom: 15px; opacity: 0.3; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 520px;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      border: 2px solid #e0e7ff;
      border-radius: 14px;
      font-size: 1em;
      resize: vertical;
      margin-top: 10px;
    }

    .campos-data-hora {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo label {
      font-size: 0.92em;
      font-weight: 600;
      color: #334155;
    }

    .campo input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e7ff;
      border-radius: 12px;
      font-size: 1em;
      outline: none;
    }

    .campo input:focus, textarea:focus {
      border-color: #6366f1;
    }

    .modal-buttons {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel { background: #e2e8f0; color: #334155; }
    .btn-save { background: #6366f1; color: white; }

    .footer {
      text-align: center;
      padding: 22px;
      background: #f8fafc;
      color: #64748b;
    }

    @media (max-width: 640px) {
      .campos-data-hora {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fas fa-backpack"></i> Minha Mochila</h1>
      <p>Organize suas matérias e anotações</p>
    </header>

    <div class="main">
      <div class="left">
        <h2><i class="fas fa-book"></i> Matérias Disponíveis</h2>
        <div class="materias-disponiveis" id="lista-disponiveis"></div>
      </div>

      <div class="right">
        <h2><i class="fas fa-school"></i> Minha Mochila (<span id="contador">0</span>)</h2>
        <div class="mochila" id="mochila"></div>
        <br>
        <button onclick="limparMochila()" style="background:#ef4444; color:white;">
          <i class="fas fa-trash"></i> Limpar Mochila
        </button>
      </div>
    </div>

    <div class="footer">
      Suas anotações são salvas no navegador (funciona no GitHub Pages)
    </div>
  </div>

  <!-- Modal de Anotações -->
  <div class="modal" id="modalAnotacao">
    <div class="modal-content">
      <h2 id="modalTitulo">Anotações - Matemática</h2>
      
      <textarea id="textoAnotacao" placeholder="Escreva suas anotações aqui..."></textarea>

      <div class="campos-data-hora">
        <div class="campo">
          <label for="dataAnotacao">Data</label>
          <input type="date" id="dataAnotacao">
        </div>
        <div class="campo">
          <label for="horaAnotacao">Hora</label>
          <input type="time" id="horaAnotacao">
        </div>
      </div>
      
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn-save" onclick="salvarAnotacao()">Salvar Anotação</button>
      </div>
    </div>
  </div>

  <script>
    const materiasDisponiveis = [
      "Português", "Matemática", "História", "Filosofia", "Sociologia",
      "Inglês", "Geografia", "Artes", "HTML", "AMC", "Lógica de Programação",
      "Noções de Robótica", "Projeto de Vida", "Estudos Orientados", "Programação Web"
    ];

    let mochila = [];
    let indexAtual = null;

    function formatarHoraAgora() {
      const agora = new Date();
      const h = String(agora.getHours()).padStart(2, '0');
      const m = String(agora.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    function formatarDataAgora() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }

    function normalizarDados() {
      mochila = mochila.map(item => {
        if (typeof item.anotacao === 'string') {
          return {
            nome: item.nome,
            anotacao: {
              texto: item.anotacao,
              data: '',
              hora: ''
            }
          };
        }

        return {
          nome: item.nome,
          anotacao: {
            texto: item.anotacao?.texto || '',
            data: item.anotacao?.data || '',
            hora: item.anotacao?.hora || ''
          }
        };
      });
    }

    // ==================== SALVAMENTO ALTERNATIVO ====================
    function salvarDados() {
      try {
        localStorage.setItem('mochilaEscolar', JSON.stringify(mochila));
      } catch (e) {
        console.warn("localStorage bloqueado. As anotações não serão salvas após fechar a aba.");
      }
    }

    function carregarDados() {
      try {
        const dados = localStorage.getItem('mochilaEscolar');
        if (dados) mochila = JSON.parse(dados);
        normalizarDados();
      } catch (e) {
        console.warn("Não foi possível carregar os dados salvos.");
        mochila = [];
      }
    }
    // ============================================================

    function renderizarDisponiveis() {
      const container = document.getElementById('lista-disponiveis');
      container.innerHTML = '';

      materiasDisponiveis.forEach(materia => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<i class="fas fa-book-open"></i><div>${materia}</div>`;
        card.onclick = () => adicionarNaMochila(materia);
        container.appendChild(card);
      });
    }

    function adicionarNaMochila(materia) {
      if (mochila.some(item => item.nome === materia)) {
        alert(`⚠️ ${materia} já está na sua mochila!`);
        return;
      }

      mochila.push({
        nome: materia,
        anotacao: {
          texto: "",
          data: "",
          hora: ""
        }
      });

      salvarDados();
      renderizarMochila();
    }

    function renderizarMochila() {
      const container = document.getElementById('mochila');
      const contador = document.getElementById('contador');
      contador.textContent = mochila.length;

      if (mochila.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-backpack"></i>
            <h3>Sua mochila está vazia</h3>
            <p>Clique nas matérias à esquerda para adicionar</p>
          </div>`;
        return;
      }

      let html = '';
      mochila.forEach((item, index) => {
        const texto = item.anotacao?.texto || '';
        const data = item.anotacao?.data || '';
        const hora = item.anotacao?.hora || '';

        html += `
          <div class="item-mochila" onclick="abrirModal(${index})">
            <div class="item-header">
              <h3><i class="fas fa-book"></i> ${item.nome}</h3>
              <button class="btn-remover" onclick="event.stopImmediatePropagation(); removerDaMochila(${index});">
                <i class="fas fa-trash"></i>
              </button>
            </div>
            ${texto 
              ? `<p class="anotacao">${texto.substring(0, 120)}${texto.length > 120 ? '...' : ''}</p>` 
              : '<p style="color:#94a3b8; font-style:italic;">Clique para adicionar anotações...</p>'}
            ${(data || hora) 
              ? `<div class="meta-anotacao">
                   <i class="fas fa-calendar"></i> ${data || 'sem data'}
                   &nbsp; | &nbsp;
                   <i class="fas fa-clock"></i> ${hora || 'sem hora'}
                 </div>` 
              : ''}
          </div>`;
      });

      container.innerHTML = html;
    }

    function abrirModal(index) {
      indexAtual = index;

      document.getElementById('modalTitulo').textContent = `Anotações - ${mochila[index].nome}`;
      document.getElementById('textoAnotacao').value = mochila[index].anotacao?.texto || "";

      document.getElementById('dataAnotacao').value = mochila[index].anotacao?.data || formatarDataAgora();
      document.getElementById('horaAnotacao').value = mochila[index].anotacao?.hora || formatarHoraAgora();

      document.getElementById('modalAnotacao').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('modalAnotacao').style.display = 'none';
    }

    function salvarAnotacao() {
      if (indexAtual !== null) {
        mochila[indexAtual].anotacao = {
          texto: document.getElementById('textoAnotacao').value.trim(),
          data: document.getElementById('dataAnotacao').value,
          hora: document.getElementById('horaAnotacao').value
        };

        salvarDados();
        fecharModal();
        renderizarMochila();
      }
    }

    function removerDaMochila(index) {
      if (confirm(`Remover ${mochila[index].nome}?`)) {
        mochila.splice(index, 1);
        salvarDados();
        renderizarMochila();
      }
    }

    function limparMochila() {
      if (confirm("Limpar toda a mochila?")) {
        mochila = [];
        salvarDados();
        renderizarMochila();
      }
    }

    // Inicialização
    window.onload = () => {
      carregarDados();
      renderizarDisponiveis();
      renderizarMochila();
    };
  </script>
</body>
