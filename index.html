<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Mochila Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  height: 100vh;
  overflow: hidden;
}

.container {
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 300px;
  background: rgba(30, 41, 59, 0.9);
  backdrop-filter: blur(12px);
  padding: 20px;
  border-right: 1px solid #334155;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.header h1 {
  font-size: 22px;
}

/* Input */
.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.input-group input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #334155;
  color: white;
}

.add-btn {
  background: #8b5cf6;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  color: white;
  font-weight: bold;
  transition: 0.2s;
}

.add-btn:hover {
  background: #7c3aed;
}

/* Subjects */
.subjects {
  flex: 1;
  overflow-y: auto;
}

.subject {
  background: #334155;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.subject:hover {
  transform: translateX(5px);
  background: #475569;
}

/* Projects */
.projects {
  margin-top: 20px;
}

.projects a {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #334155;
  border-radius: 8px;
  margin-bottom: 8px;
  text-decoration: none;
  color: white;
  transition: 0.2s;
}

.projects a:hover {
  background: #475569;
}

/* Main */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.card {
  text-align: center;
  animation: fadeIn 1s ease;
}

.card img {
  width: 160px;
  margin-bottom: 20px;
}

.card h2 {
  font-size: 36px;
}

.card p {
  color: #94a3b8;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="header">
      🎒 <h1>Minha Mochila</h1>
    </div>

    <div class="input-group">
      <input id="inputMateria" placeholder="Nova matéria...">
      <button class="add-btn" onclick="addMateria()">+</button>
    </div>

    <div class="subjects" id="lista"></div>

    <div class="projects">
      <h4 style="margin-bottom:10px;color:#94a3b8;">Projetos</h4>

      <a href="https://www.google.com" target="_blank">♿ Braille</a>
      <a href="https://www.youtube.com" target="_blank">📚 Aulas</a>
      <a href="https://www.github.com" target="_blank">🎓 CAPS</a>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">
      <h2>Bem-vindo 👋</h2>
      <p>Organize suas matérias de forma simples e bonita</p>
    </div>
  </div>

</div>

<script>
let materias = JSON.parse(localStorage.getItem("materias")) || [];

function render() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  materias.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = "subject";
    div.innerHTML = "📘 " + m;
    lista.appendChild(div);
  });

  localStorage.setItem("materias", JSON.stringify(materias));
}

function addMateria() {
  const input = document.getElementById("inputMateria");
  if (input.value.trim() === "") return;

  materias.push(input.value);
  input.value = "";
  render();
}

render();
</script>

</body>
</html>
